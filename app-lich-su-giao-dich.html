<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lịch sử giao dịch Linh Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4a1488}a:hover{color:#2e0b57}
</style>
<style>body{margin:0;background:#e6dcef;display:flex;justify-content:center;padding:32px 16px 80px;min-height:100vh;box-sizing:border-box}</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5eefa; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #2a1740; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 18px 20px 10px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="index.html" style="order: 3; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #4a1488; text-decoration: none; background: #ffffff; border: 1px solid #d8c6ea; padding: 6px 10px; border-radius: 999px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Trang chính</a><a href="app-trang-chu.html" aria-label="Quay lại trang chủ" style="width: 44px; height: 44px; border-radius: 14px; background: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a1488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div style="font-size: 18px; font-weight: 700">Lịch sử giao dịch</div>
    </div>

    <div style="background: #2e0b57; border-radius: 18px; padding: 16px 18px; color: #f7f0fd; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px">
      <div><div style="font-size: 12px; color: #d6c4ea">Chi tiêu năm 2027</div><div style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: #e3c27a">15,85 triệu</div></div>
      <div><div style="font-size: 12px; color: #d6c4ea">Điểm đang có</div><div style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: #e3c27a">2.450</div></div>
      <div style="grid-column: span 2; font-size: 12px; color: #d6c4ea">Mọi giao dịch đều có hóa đơn điện tử, bấm vào từng dòng để xem</div>
    </div>

    <div style="display: flex; gap: 8px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="4">
        <button onClick="{{ f.pick }}" style="height: 36px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid #d8c6ea; background: {{ f.bg }}; color: {{ f.fg }}">{{ f.label }}</button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ items }}" as="t" hint-placeholder-count="6">
        <button style="font: inherit; text-align: left; border: 0; cursor: pointer; background: #ffffff; border-radius: 14px; padding: 11px 12px; display: flex; gap: 12px; align-items: center; color: #2a1740">
          <span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: {{ t.iconBg }}; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: {{ t.iconFg }}">{{ t.tag }}</span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600; line-height: 1.3">{{ t.title }}</span>
            <span style="font-size: 12px; color: #5d4c73">{{ t.sub }}</span>
          </span>
          <span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
            <span style="font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums">{{ t.amount }}</span>
            <span style="font-size: 12px; font-weight: 600; color: {{ t.pointColor }}">{{ t.points }}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #ece2f5; padding: 8px 4px 14px">
    <a href="app-trang-chu.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Trang chủ</a>
    <a href="app-uu-dai.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 002-2V5h14v2a2 2 0 000 4v2a2 2 0 000 4v2H5v-2a2 2 0 00-2-2z"/><path d="M10 9v6"/></svg>Ưu đãi</a>
    <a href="app-lich-su-giao-dich.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #4a1488; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Giao dịch</a>
    <a href="app-thu-mau-moi.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8z"/></svg>Thử màu</a>
    <a href="app-trang-chu.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Tài khoản</a>
  </nav>
</div>
</template>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 'all' }; }
  renderVals() {
    const svc = { iconBg: '#efe5f8', iconFg: '#4a1488' };
    const prd = { iconBg: '#f6edd9', iconFg: '#7a5a12' };
    const pts = { iconBg: '#fbe4ef', iconFg: '#8e1257' };
    const plus = '#1f6b42', minus = '#8e1257';
    const all = [
      { kind: 'svc', tag: 'DV', title: 'Trẻ hóa da, buổi 4 trên 10', sub: '12/03 · Cơ sở 3, Gò Vấp', amount: 'Trừ liệu trình', points: 'Còn 6 buổi', pointColor: '#5d4c73', ...svc },
      { kind: 'prd', tag: 'SP', title: 'Kem chống nắng sau điều trị', sub: '12/03 · Cơ sở 3, Gò Vấp', amount: '650.000 đ', points: '+65 điểm', pointColor: plus, ...prd },
      { kind: 'pts', tag: 'Đ', title: 'Bạn Minh Thư dùng mã giới thiệu', sub: '05/03 · Ưu đãi lần đầu cho bạn', amount: '0 đ', points: '+500 điểm', pointColor: plus, ...pts },
      { kind: 'svc', tag: 'DV', title: 'Phun môi Personal 4K Color', sub: '18/02 · Cơ sở 1, Quận 10', amount: '3.500.000 đ', points: '+350 điểm', pointColor: plus, ...svc },
      { kind: 'pts', tag: 'Đ', title: 'Đổi điểm lấy voucher 300.000 đ', sub: '18/02 · Trừ vào hóa đơn phun môi', amount: '−300.000 đ', points: '−1.000 điểm', pointColor: minus, ...pts },
      { kind: 'svc', tag: 'DV', title: 'Mua gói trẻ hóa da 10 buổi', sub: '06/01 · Cơ sở 3, Gò Vấp', amount: '12.000.000 đ', points: '+1.200 điểm', pointColor: plus, ...svc }
    ];
    const defs = [['all', 'Tất cả'], ['svc', 'Dịch vụ'], ['prd', 'Sản phẩm'], ['pts', 'Điểm thưởng']];
    const f = this.state.filter;
    const filters = defs.map(([id, label]) => ({
      label, bg: id === f ? '#4a1488' : '#ffffff', fg: id === f ? '#ffffff' : '#4a1488',
      pick: () => this.setState({ filter: id })
    }));
    const items = f === 'all' ? all : all.filter((t) => t.kind === f);
    return { filters, items };
  }
}
dcMount(Component);
</script>

</body>
</html>
