<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App thành viên Linh Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4a1488}a:hover{color:#2e0b57}
</style>
<style>body{margin:0;background:#e6dcef;display:flex;justify-content:center;padding:32px 16px 80px;min-height:100vh;box-sizing:border-box}</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5eefa; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #2a1740; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 22px 20px 12px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div>
        <div style="font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700; color: #4a1488">Linh Anh</div>
        <div style="font-size: 22px; font-weight: 700; margin-top: 2px">Chào chị Lan</div>
      </div>
      <button aria-label="Thông báo" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #ffffff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a1488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg></button>
    </div>

    <div style="background: #2e0b57; border-radius: 20px; padding: 18px 20px; color: #f7f0fd; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 700; color: #e3c27a">Hạng Vàng</span>
        <span style="font-size: 15px; font-weight: 600">2.450 điểm</span>
      </div>
      <div style="height: 8px; background: #4a1f7c; border-radius: 4px; overflow: hidden"><div style="width: 82%; height: 8px; background: #e3c27a; border-radius: 4px"></div></div>
      <span style="font-size: 13px; color: #d6c4ea">Còn 550 điểm để lên hạng Kim cương</span>
    </div>

    <div style="background: #ffffff; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; color: #5d4c73">Lịch hẹn sắp tới</span>
      <div style="display: flex; gap: 14px; align-items: center">
        <div style="width: 54px; height: 58px; border-radius: 14px; background: #f3eafb; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 12px; color: #5d4c73">T7</span><span style="font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 700; color: #4a1488">20</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700">Trẻ hóa da, 9:30</span><span style="font-size: 13px; color: #5d4c73">Cơ sở 3, Phan Văn Trị, Gò Vấp</span></div>
      </div>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1; height: 44px; font: inherit; font-size: 14px; font-weight: 600; border: 1px solid #d8c6ea; border-radius: 12px; background: #ffffff; color: #4a1488; cursor: pointer">Đổi lịch</button>
        <button style="flex: 1; height: 44px; font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 12px; background: #4a1488; color: #ffffff; cursor: pointer">Chỉ đường</button>
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700">Liệu trình trẻ hóa da</span><span style="font-size: 14px; font-weight: 600; color: #4a1488">Còn 6 trên 10 buổi</span></div>
      <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{ sessions }}" as="s" hint-placeholder-count="10"><div style="height: 8px; border-radius: 4px; background: {{ s.c }}"></div></sc-for>
      </div>
      <span style="font-size: 13px; color: #5d4c73">Lần tiếp theo nên làm trước ngày 05/04 để giữ hiệu quả</span>
    </div>

    <div style="background: #fbe4ef; border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 15px; font-weight: 700; color: #6e0f45">Giới thiệu bạn bè</span>
      <span style="font-size: 13px; line-height: 1.45; color: #5a1038">Bạn chị nhận ưu đãi lần đầu, chị nhận 500 điểm khi bạn hoàn thành dịch vụ.</span>
      <div style="display: flex; gap: 8px; align-items: center">
        <span style="flex: 1; height: 44px; border: 1px dashed #b5176f; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; letter-spacing: 2px; color: #8e1257; background: #fff6fa">LAN2450</span>
        <button style="height: 44px; font: inherit; font-size: 14px; font-weight: 600; border: 0; border-radius: 12px; padding: 0 16px; background: #b5176f; color: #ffffff; cursor: pointer">Gửi qua Zalo</button>
      </div>
    </div>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #ece2f5; padding: 8px 4px 14px">
    <a href="app-trang-chu.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #4a1488; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Trang chủ</a>
    <a href="app-uu-dai.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 002-2V5h14v2a2 2 0 000 4v2a2 2 0 000 4v2H5v-2a2 2 0 00-2-2z"/><path d="M10 9v6"/></svg>Ưu đãi</a>
    <a href="app-lich-su-giao-dich.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Giao dịch</a>
    <a href="app-thu-mau-moi.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8z"/></svg>Thử màu</a>
    <a href="app-trang-chu.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Tài khoản</a>
  </nav>
</div>
</template>
<a href="index.html" style="position:fixed;left:16px;bottom:16px;z-index:9;font:600 14px 'Be Vietnam Pro',system-ui,sans-serif;background:#2e0b57;color:#e3c27a;text-decoration:none;padding:10px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)">Về trang chính</a>
<script>
class Component extends DCLogic {
  renderVals() {
    const sessions = Array.from({ length: 10 }, (_, i) => ({ c: i < 4 ? '#c9b3e4' : '#4a1488' }));
    return { sessions };
  }
}
dcMount(Component);
</script>

</body>
</html>
