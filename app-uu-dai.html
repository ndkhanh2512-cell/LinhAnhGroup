<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ưu đãi Linh Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4a1488}a:hover{color:#2e0b57}
</style>
<style>body{margin:0;background:#e6dcef;display:flex;justify-content:center;padding:32px 16px 80px;min-height:100vh;box-sizing:border-box}</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5eefa; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #2a1740; display: flex; flex-direction: column">
  <div style="flex: 1; padding: 18px 20px 10px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="index.html" style="order: 3; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: #4a1488; text-decoration: none; background: #ffffff; border: 1px solid #d8c6ea; padding: 6px 10px; border-radius: 999px"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Trang chính</a><a href="app-trang-chu.html" aria-label="Quay lại trang chủ" style="width: 44px; height: 44px; border-radius: 14px; background: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4a1488" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <div>
        <div style="font-size: 18px; font-weight: 700">Ưu đãi của chị</div>
        <div style="font-size: 12px; color: #5d4c73">Chọn theo hạng thành viên và lịch sử điều trị</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #e8dcf4; padding: 4px; border-radius: 14px">
      <button onClick="{{ showCodes }}" style="height: 40px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{ tabA.bg }}; color: {{ tabA.fg }}">Mã của tôi</button>
      <button onClick="{{ showPrograms }}" style="height: 40px; border: 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: {{ tabB.bg }}; color: {{ tabB.fg }}">Chương trình</button>
    </div>

    <sc-if value="{{ isCodes }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{ codes }}" as="c" hint-placeholder-count="3">
          <div style="background: #ffffff; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden">
            <div style="padding: 14px 16px 12px; display: flex; gap: 12px; align-items: flex-start">
              <span style="flex: none; min-width: 58px; height: 52px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: {{ c.badgeBg }}; color: {{ c.badgeFg }}; display: inline-flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; font-size: 19px; font-weight: 700">{{ c.value }}</span>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="font-size: 15px; font-weight: 700; line-height: 1.3">{{ c.title }}</span>
                <span style="font-size: 12px; line-height: 1.4; color: #5d4c73">{{ c.scope }}</span>
              </div>
            </div>
            <div style="border-top: 1px dashed #d8c6ea; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
              <div style="display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: #4a1488">{{ c.code }}</span><span style="font-size: 12px; color: {{ c.dueColor }}">{{ c.due }}</span></div>
              <button onClick="{{ c.copy }}" style="height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border: 0; background: {{ c.btnBg }}; color: {{ c.btnFg }}">{{ c.btnLabel }}</button>
            </div>
          </div>
        </sc-for>
        <p style="margin: 2px 0 0; font-size: 12px; line-height: 1.45; color: #5d4c73">Mã chỉ áp dụng cho dịch vụ nằm trong phạm vi được cấp phép của từng cơ sở và không cộng dồn với chương trình khác.</p>
      </div>
    </sc-if>

    <sc-if value="{{ isPrograms }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="background: #2e0b57; border-radius: 18px; padding: 18px; color: #f7f0fd; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 600; color: #2e0b57; background: #e3c27a; align-self: flex-start; padding: 3px 10px; border-radius: 999px">Mừng 10 năm Linh Anh</span>
          <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 24px; font-weight: 700; color: #e3c27a; line-height: 1.2">Ưu đãi 10 năm có 1</span>
          <span style="font-size: 14px; line-height: 1.45">Xử lý mày, môi cũ 0 đồng. Đặt lịch tư vấn để bác sĩ đánh giá tình trạng trước.</span>
          <button style="margin-top: 6px; height: 44px; border: 0; border-radius: 12px; font: inherit; font-size: 14px; font-weight: 700; background: #e3c27a; color: #2e0b57; cursor: pointer">Đặt lịch tư vấn</button>
        </div>
        <sc-for list="{{ programs }}" as="p" hint-placeholder-count="3">
          <div style="background: #ffffff; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
            <span style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: {{ p.iconBg }}; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{ p.iconFg }}">{{ p.tag }}</span>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 14px; font-weight: 700; line-height: 1.3">{{ p.title }}</span>
              <span style="font-size: 12px; line-height: 1.4; color: #5d4c73">{{ p.sub }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #ece2f5; padding: 8px 4px 14px">
    <a href="app-trang-chu.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Trang chủ</a>
    <a href="app-uu-dai.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #4a1488; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 002-2V5h14v2a2 2 0 000 4v2a2 2 0 000 4v2H5v-2a2 2 0 00-2-2z"/><path d="M10 9v6"/></svg>Ưu đãi</a>
    <a href="app-lich-su-giao-dich.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Giao dịch</a>
    <a href="app-thu-mau-moi.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8z"/></svg>Thử màu</a>
    <a href="app-trang-chu.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Tài khoản</a>
  </nav>
</div>
</template>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'codes', copied: null }; }
  renderVals() {
    const tab = this.state.tab;
    const on = { bg: '#ffffff', fg: '#4a1488' }, off = { bg: 'transparent', fg: '#5d4c73' };
    const raw = [
      { code: 'SINHNHAT10', value: '10%', title: 'Quà sinh nhật hạng Vàng', scope: 'Giảm 10% mọi dịch vụ tại 13 cơ sở', due: 'Hết hạn sau 3 ngày', dueColor: '#a3135f', badgeBg: '#2e0b57', badgeFg: '#e3c27a' },
      { code: 'PHUNMOI20', value: '20%', title: 'Phun môi Personal 4K Color', scope: 'Cơ sở 1 đến 6, TP.HCM, trong tháng 11', due: 'Hạn dùng 30/11', dueColor: '#5d4c73', badgeBg: '#fbe4ef', badgeFg: '#8e1257' },
      { code: 'LAN2450', value: '500K', title: 'Quà cho bạn chị giới thiệu', scope: 'Bạn mới được giảm 500.000 đ ở lần làm dịch vụ đầu tiên', due: 'Dùng được 2 lần nữa', dueColor: '#5d4c73', badgeBg: '#f6edd9', badgeFg: '#7a5a12' }
    ];
    const codes = raw.map((c) => {
      const done = this.state.copied === c.code;
      return { ...c, btnLabel: done ? 'Đã sao chép' : 'Sao chép mã', btnBg: done ? '#e3f4ea' : '#4a1488', btnFg: done ? '#1f6b42' : '#ffffff', copy: () => this.setState({ copied: c.code }) };
    });
    const programs = [
      { tag: 'x2', title: 'Nhân đôi điểm cuối tuần', sub: 'Thành viên Vàng trở lên, dịch vụ chăm sóc da', iconBg: '#efe5f8', iconFg: '#4a1488' },
      { tag: '+1', title: 'Gói trẻ hóa da 10 buổi tặng 1 buổi', sub: 'Gợi ý vì chị còn 6 buổi trong liệu trình hiện tại', iconBg: '#fbe4ef', iconFg: '#8e1257' },
      { tag: 'Đ', title: 'Đổi 1.000 điểm lấy voucher 300.000 đ', sub: 'Chị đang có 2.450 điểm', iconBg: '#f6edd9', iconFg: '#7a5a12' }
    ];
    return {
      tabA: tab === 'codes' ? on : off, tabB: tab === 'programs' ? on : off,
      isCodes: tab === 'codes', isPrograms: tab === 'programs',
      showCodes: () => this.setState({ tab: 'codes' }), showPrograms: () => this.setState({ tab: 'programs' }),
      codes, programs
    };
  }
}
dcMount(Component);
</script>

</body>
</html>
