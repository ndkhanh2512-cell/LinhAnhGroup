<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linh Anh điều hành: tổng quan</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4a1488}a:hover{color:#2e0b57}
</style>
<style>body{margin:0;background:#e6dcef;display:flex;justify-content:center;padding:32px 16px 80px;min-height:100vh;box-sizing:border-box}</style>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f5eefa; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #2a1740; display: flex; flex-direction: column">
  <div style="background: #2e0b57; color: #f7f0fd; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700; color: #e3c27a">Linh Anh</span>
      <span style="font-size: 12px; font-weight: 600; color: #2e0b57; background: #e3c27a; padding: 3px 9px; border-radius: 999px">Số liệu minh họa</span>
    </div>
    <div style="font-size: 14px; color: #d6c4ea">Chào buổi sáng, thứ Hai 15/03</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #d6c4ea">Hôm qua thu</span><span style="font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700; color: #e3c27a">2,31 tỷ</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #d6c4ea">Lãi từ đầu tháng</span><span style="font-family: 'Playfair Display', Georgia, serif; font-size: 30px; font-weight: 700; color: #e3c27a">8,1 tỷ</span></div>
    </div>
    <button style="height: 56px; border: 0; border-radius: 16px; background: #b5176f; color: #ffffff; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>Hỏi bằng giọng nói</button>
    <span style="font-size: 13px; color: #d6c4ea; text-align: center">Ví dụ: “Tháng này lãi bao nhiêu, cơ sở nào kém nhất?”</span>
  </div>
  <div style="flex: 1; padding: 18px 20px 10px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <span style="font-size: 16px; font-weight: 700; color: #2e0b57">3 báo cáo nên xem mỗi sáng</span>
    <sc-for list="{{ reports }}" as="r" hint-placeholder-count="3">
      <a href="{{ r.href }}" style="text-decoration: none; color: #2a1740; background: #ffffff; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
        <span style="flex: none; width: 46px; height: 46px; border-radius: 14px; background: {{ r.bg }}; color: {{ r.fg }}; display: inline-flex; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700">{{ r.n }}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="font-size: 15px; font-weight: 700">{{ r.title }}</span>
          <span style="font-size: 13px; line-height: 1.4; color: #5d4c73">{{ r.line }}</span>
        </span>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7a2bc2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </sc-for>
    <div style="background: #fbe4ef; border-radius: 16px; padding: 12px 14px; font-size: 13px; line-height: 1.45; color: #5a1038"><b>Một việc cần quyết hôm nay:</b> duyệt bảng giá giảm 20% phun môi tháng 11 do trưởng marketing gửi.</div>
  </div>
<nav style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #ece2f5; padding: 8px 8px 14px"><a href="ban-giam-doc-tong-quan.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: #4a1488; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Tổng quan</a><a href="ban-giam-doc-lai-lo.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Lãi lỗ</a><a href="ban-giam-doc-tien-tra-truoc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/></svg>Trả trước</a><a href="ban-giam-doc-suc-khoe-co-so.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: #5d4c73; text-decoration: none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Cơ sở</a></nav>
</div>
</template>
<a href="index.html" style="position:fixed;left:16px;bottom:16px;z-index:9;font:600 14px 'Be Vietnam Pro',system-ui,sans-serif;background:#2e0b57;color:#e3c27a;text-decoration:none;padding:10px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25)">Về trang chính</a>
<script>
class Component extends DCLogic {
  renderVals() {
    return { reports: [
      { n: '1', title: 'Lãi lỗ tháng 2', line: 'Lãi 16,2 tỷ: cứ 100 đồng khách trả, còn lại 25 đồng lãi', href: 'ban-giam-doc-lai-lo.html', bg: '#2e0b57', fg: '#e3c27a' },
      { n: '2', title: 'Tiền khách trả trước', line: '42,6 tỷ là tiền của khách, còn 18.300 buổi phải phục vụ', href: 'ban-giam-doc-tien-tra-truoc.html', bg: '#f6edd9', fg: '#7a5a12' },
      { n: '3', title: 'Sức khỏe 13 cơ sở', line: '10 xanh, 2 vàng, 1 đỏ: Bình Dương 2 cần xử lý', href: 'ban-giam-doc-suc-khoe-co-so.html', bg: '#fbe4ef', fg: '#8e1257' }
    ] };
  }
}
dcMount(Component);
</script>

</body>
</html>
